apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: ghcr.io/rfun-solutions/app:latest
          resources:
            requests:
              cpu: 500m
              memory: 1792Mi
            limits:
              cpu: 1000m
              memory: 2Gi
